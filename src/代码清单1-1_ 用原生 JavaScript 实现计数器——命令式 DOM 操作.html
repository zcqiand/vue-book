<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>原生 JavaScript 计数器</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .counter-container {
      text-align: center;
    }
    .count-display {
      font-size: 3rem;
      margin: 1rem 0;
    }
    button {
      font-size: 1.2rem;
      padding: 0.5rem 1.5rem;
      margin: 0 0.5rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="counter-container">
    <div id="count-display" class="count-display">0</div>
    <button id="decrement-btn">-1</button>
    <button id="increment-btn">+1</button>
  </div>

  <script>
    var count = 0;
    var countDisplay = document.getElementById('count-display');
    var incrementBtn = document.getElementById('increment-btn');
    var decrementBtn = document.getElementById('decrement-btn');

    function updateDisplay() {
      // 手动把最新的 count 写回 DOM 节点
      countDisplay.innerText = count;
    }

    incrementBtn.addEventListener('click', function () {
      count = count + 1;
      updateDisplay();
    });

    decrementBtn.addEventListener('click', function () {
      count = count - 1;
      updateDisplay();
    });
  </script>
</body>
</html>
