server {
    listen 80;
    server_name example.com;

    # 前端静态产物根目录
    root /var/www/vue-book-demo/dist;
    index index.html;

    # /api 反向代理到后端：业务代码继续写 /api/users，由 Nginx 转发到后端
    # 注意 proxy_pass 末尾的斜杠：带斜杠会把 /api 前缀去掉转发，不带则保留
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        # 把真实客户端 IP 透传给后端，否则后端看到的都是 Nginx 的内网 IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 提示后端本请求经过了 HTTPS 反代（若外层是 HTTPS），后端按此生成正确的 URL
        proxy_set_header X-Forwarded-Proto $scheme;
        # 反代超时与重试：业务接口响应慢时避免 Nginx 提前断开
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # SPA history 模式 fallback：先找文件、再找目录、都失败回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}